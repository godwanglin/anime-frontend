<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					const useDark = saved ? saved === 'dark' : prefersDark;

					document.documentElement.classList.toggle('dark', useDark);
					document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
				} catch {
					// no-op
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="app-icons-loading" data-sveltekit-preload-data="hover">
		<div id="app-splash" class="app-splash" role="status" aria-live="polite">
			<div class="app-splash-mark" aria-hidden="true">
				<img src="/favicon.png" alt="Logo Anivyx" width="68" height="68" />
			</div>
			<div class="app-splash-copy">
				<strong>Anivyx</strong>
				<span>Menyiapkan konten...</span>
			</div>
		</div>
		<div id="app-root" style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const loadingClass = 'app-icons-loading';
				const readyClass = 'app-icons-ready';
				const iconFont = 'Material Symbols Rounded';
				const maxWait = 4500;
				const faceWait = 1800;
				const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
				const normalize = (value) => String(value).replace(/["']/g, '').toLowerCase();

				const hasIconFace = () => {
					if (!document.fonts || typeof document.fonts.forEach !== 'function') return true;

					let found = false;
					document.fonts.forEach((face) => {
						if (normalize(face.family) === normalize(iconFont)) found = true;
					});

					return found;
				};

				const finish = () => {
					const body = document.body;
					if (!body || body.classList.contains(readyClass)) return;

					body.classList.add(readyClass);

					window.setTimeout(() => {
						body.classList.remove(loadingClass, readyClass);
						document.getElementById('app-splash')?.remove();
					}, 450);
				};

				const waitForIconFont = async () => {
					if (!document.fonts) {
						finish();
						return;
					}

					const probe = document.createElement('span');
					probe.setAttribute('aria-hidden', 'true');
					probe.textContent = 'home';
					probe.style.cssText =
						'position:fixed;left:-9999px;top:-9999px;font-family:"Material Symbols Rounded";font-size:24px;font-weight:400;line-height:1;opacity:0;pointer-events:none;';
					document.body.appendChild(probe);

					try {
						const started = performance.now();
						while (!hasIconFace() && performance.now() - started < faceWait) {
							await sleep(50);
						}

						await Promise.race([
							(async () => {
								await document.fonts.load('400 24px "Material Symbols Rounded"', 'home');

								while (
									!document.fonts.check('400 24px "Material Symbols Rounded"', 'home') &&
									performance.now() - started < maxWait
								) {
									await sleep(50);
								}
							})(),
							sleep(maxWait)
						]);
					} finally {
						probe.remove();
						requestAnimationFrame(finish);
					}
				};

				const start = () => {
					waitForIconFont().catch(finish);
				};

				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', start, { once: true });
				} else {
					start();
				}
			})();
		</script>
	</body>
</html>
